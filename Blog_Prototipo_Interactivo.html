let state = {
  view: 'dashboard', // dashboard | template | editor | reader | publish
  articles: [...ARTICLES],
  activeArticle: null,
  editorTitle: '',
  editorExcerpt: '',
  editorContent: '',

  editorTagInput: '',
  editorTemplate: null,

  publishRoles: [],

  userSearch: '',
};

// ── Helpers ──────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const div = document.createElement('div');
  div.className = `toast pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-semibold ${type==='success'?'bg-emerald-600 text-white':'bg-red-500 text-white'}`;
  div.innerHTML = `<span>${type==='success'?'✓':'⚠'}</span><span>${msg}</span>`;
  c.appendChild(div);
  setTimeout(() => div.remove(), 3600);
}

function statusBadge(status) {
  const m = {
    published:{t:'Publicado',  c:'text-emerald-700 bg-emerald-50 border-emerald-200'},
    draft:    {t:'Borrador',   c:'text-amber-700  bg-amber-50  border-amber-200'},
    editing:  {t:'En Edición', c:'text-blue-700   bg-blue-50   border-blue-200'},
  };
  const s = m[status]||m.draft;
  const ic = status==='published'?'✓' : status==='draft'?'⏱' : '✏';
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${s.c}">${ic} ${s.t}</span>`;
}

function coverDiv(g, e, h='h-44', large=false) {
  return `<div class="w-full ${h} bg-gradient-to-br ${g} flex items-center justify-center rounded-xl"><span class="text-${large?'7xl':'5xl'}">${e}</span></div>`;
}

function filtered() {
  return state.articles.filter(a => {
    const q = state.searchQuery.toLowerCase();
    const matchQ = !q || a.title.toLowerCase().includes(q) || a.excerpt.toLowerCase().includes(q);
    const matchS = state.statusFilter === 'all' || a.status === state.statusFilter;
    const matchC = state.categoryFilter === 'all' || a.category === state.categoryFilter;
    return matchQ && matchS && matchC;
  });
}

function categoryCounts() {
  return CATEGORIES.reduce((acc, cat) => {
    acc[cat.key] = cat.key === 'all'
      ? state.articles.length
      : state.articles.filter(a => a.category === cat.key).length;
    return acc;
  }, {});
}

// ── Render functions ─────────────────────────────────────────────
function renderDashboard() {
  const arts   = filtered();
  const counts = categoryCounts();
  const pub    = state.articles.filter(a=>a.status==='published').length;
  const draft  = state.articles.filter(a=>a.status==='draft').length;
  const edit   = state.articles.filter(a=>a.status==='editing').length;

  const statBtns = ['all','published','draft','editing'].map(s =>
    `<button onclick="setFilter('${s}')" class="px-3 py-2 rounded-xl text-xs font-semibold border transition-all ${state.statusFilter===s?'bg-teal-600 text-white border-teal-600':'bg-white text-slate-600 border-slate-200 hover:border-teal-300'}">
      ${s==='all'?'Todos':s==='published'?'Publicados':s==='draft'?'Borradores':'En Edición'}
    </button>`
  ).join('');

  const isFiltering = state.categoryFilter !== 'all' || state.statusFilter !== 'all' || state.searchQuery.trim() !== '';

  // ── Hero card (most recent) ──────────────────────────────────────
  function heroCard(a) {
    const cat = CATEGORIES.find(c => c.key === a.category);
    const catBadge = cat && cat.key !== 'all'
      ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold border mb-3 ${cat.pill}">${cat.emoji} ${cat.label}</span>`
      : '';
    return `
      <div class="relative w-full rounded-2xl overflow-hidden cursor-pointer group animate-fade-in" style="height:420px" onclick="viewArticle(${a.id})">
        <div class="absolute inset-0 bg-gradient-to-br ${a.coverGrad} transition-transform duration-500 group-hover:scale-105"></div>
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <span class="text-9xl opacity-25 select-none">${a.coverEmoji}</span>
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/95 via-slate-900/50 to-transparent"></div>
        <div class="absolute top-4 right-4 z-10">${statusBadge(a.status)}</div>
        <div class="absolute top-4 left-4 z-10">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-white text-xs font-bold tracking-wide" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(8px)">
            ✨ Más reciente
          </span>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-6 z-10">
          ${catBadge}
          <h2 class="text-white font-extrabold text-2xl leading-tight mb-2 drop-shadow-sm" style="-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${a.title}</h2>
          <p class="text-slate-300 text-sm leading-relaxed mb-4 max-w-2xl" style="-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${a.excerpt}</p>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4 text-xs text-slate-400">
              <span>📅 ${a.date}</span>
              ${a.status==='published'?`<span>👁 ${a.views} vistas</span>`:''}
              <span class="text-slate-500">· ${a.author}</span>
            </div>
            <div class="flex items-center gap-2" onclick="event.stopPropagation()">
              <button onclick="viewArticle(${a.id})" class="inline-flex items-center gap-2 px-4 py-2 bg-white text-slate-800 rounded-xl text-sm font-bold hover:bg-slate-100 transition-all active:scale-95 shadow-md">
                👁 Leer artículo
              </button>
              <button onclick="editArticle(${a.id})" class="inline-flex items-center gap-2 px-4 py-2 text-white rounded-xl text-sm font-bold transition-all active:scale-95" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(8px)">
                ✏️ Editar
              </button>
            </div>
          </div>
        </div>
      </div>`;
  }

  // ── Carousel card ───────────────────────────────────────────────
  function carouselCard(a) {
    const cat = CATEGORIES.find(c => c.key === a.category);
    const catBadge = cat && cat.key !== 'all'
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border mb-1.5 ${cat.pill}">${cat.emoji} ${cat.label}</span>`
      : '';
    return `
      <div class="flex-shrink-0 w-52 bg-white rounded-xl border border-slate-200 overflow-hidden cursor-pointer group animate-fade-in"
        style="transition:transform .2s,box-shadow .2s"
        onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 12px 28px rgba(0,0,0,0.12)'"
        onmouseout="this.style.transform='';this.style.boxShadow=''"
        onclick="viewArticle(${a.id})">
        <div class="relative h-32 bg-gradient-to-br ${a.coverGrad} flex items-center justify-center overflow-hidden">
          <span class="text-4xl transition-transform duration-300 group-hover:scale-110">${a.coverEmoji}</span>
          <div class="absolute top-2 right-2">${statusBadge(a.status)}</div>
          <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2" onclick="event.stopPropagation()">
            <button onclick="viewArticle(${a.id})" class="p-2 bg-white/90 rounded-lg text-slate-700 hover:bg-white transition-colors shadow-md text-sm">👁</button>
            <button onclick="editArticle(${a.id})" class="p-2 bg-white/90 rounded-lg text-slate-700 hover:bg-white transition-colors shadow-md text-sm">✏️</button>
          </div>
        </div>
        <div class="p-3">
          ${catBadge}
          <h4 class="font-bold text-slate-800 text-xs leading-snug mb-1.5 group-hover:text-teal-600 transition-colors" style="-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${a.title}</h4>
          <div class="flex items-center gap-1.5 text-[11px] text-slate-400">
            <span>${a.date}</span>
            ${a.status==='published'?`<span>· ${a.views} 👁</span>`:''}
          </div>
        </div>
      </div>`;
  }

  // ── Grid card (compact, for filtered results) ───────────────────
  function gridCard(a) {
    const cat = CATEGORIES.find(c => c.key === a.category);
    const catBadge = cat && cat.key !== 'all'
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border ${cat.pill}">${cat.emoji} ${cat.label}</span>`
      : '';
    return `
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition-all animate-fade-in">
        <div class="relative cursor-pointer" onclick="viewArticle(${a.id})">
          <div class="w-full h-40 bg-gradient-to-br ${a.coverGrad} flex items-center justify-center">
            <span class="text-4xl">${a.coverEmoji}</span>
          </div>
          <div class="absolute top-2.5 right-2.5">${statusBadge(a.status)}</div>
        </div>
        <div class="p-4">
          <h3 class="font-bold text-slate-800 text-sm leading-snug mb-1 cursor-pointer hover:text-teal-600 line-clamp-2" onclick="viewArticle(${a.id})">${a.title}</h3>
          <p class="text-slate-400 text-xs line-clamp-2 mb-2.5">${a.excerpt}</p>
          ${catBadge ? `<div class="mb-3">${catBadge}</div>` : ''}
          <div class="flex items-center justify-between pt-2 border-t border-slate-100">
            <span class="text-[11px] text-slate-400">📅 ${a.date}</span>
            <div class="flex gap-1">
              <button onclick="viewArticle(${a.id})" class="p-1.5 rounded-lg text-slate-400 hover:text-teal-600 hover:bg-teal-50 transition-colors">👁</button>
              <button onclick="editArticle(${a.id})" class="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-colors">✏️</button>

            </div>
          </div>
        </div>
      </div>`;
  }

  // ── Build articles section ──────────────────────────────────────
  let articlesSection = '';
  if (arts.length === 0) {
    articlesSection = `<div class="text-center py-20 text-slate-400">
      <div class="text-5xl mb-4">📰</div>
      <p class="font-bold text-lg">No se encontraron artículos</p>
      <p class="text-sm mt-1">Intenta otro filtro o crea un nuevo artículo</p>

  } else if (isFiltering) {
    // Filtered: compact 3-col grid
    articlesSection = `<div class="grid grid-cols-3 gap-4">${arts.map(a => gridCard(a)).join('')}</div>`;
  } else {
    // Default: hero + carousel
    const rest = arts.slice(1);
    const carouselHtml = rest.length > 0 ? `
      <div>
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">

  document.getElementById('app').innerHTML = `
  <div class="min-h-screen bg-slate-50">

            <input value="${state.userSearch}" oninput="setUserSearch(this.value)"
              placeholder="🔍 Buscar usuario..."
              class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-teal-500" />
            <div class="space-y-1 max-h-40 overflow-y-auto">${userChecks}</div>
            ${state.publishUsers.length>0?`<p class="text-xs text-teal-600 font-bold">${state.publishUsers.length} usuario(s) seleccionado(s)</p>`:''}
          </div>` : ''}
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between">
        <div class="text-xs text-slate-500">
          👥 Se publicará para: <strong class="text-slate-700">${audLabel}</strong>
        </div>
        <div class="flex gap-2">
          <button onclick="goView('editor')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-200 rounded-xl font-semibold transition-colors">
            Cancelar
          </button>
          <button onclick="${canPub?'doPublish()':'void(0)'}"
            class="px-4 py-2 text-sm font-bold rounded-xl transition-all active:scale-95 ${canPub?'bg-teal-600 hover:bg-teal-700 text-white shadow-sm hover:shadow-md':'bg-slate-200 text-slate-400 cursor-not-allowed'}">
            ✓ Publicar ahora
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

// ── Event handlers ────────────────────────────────────────────────
window.goView = function(v) {
  state.view = v;
  render();
};

window.goNewArticle = function() {
  state.activeArticle = null;
  state.editorTitle = '';
  state.editorExcerpt = '';
  state.editorContent = '<p>Escribe tu artículo aquí...</p>';
  state.editorGrad = 'from-teal-400 to-cyan-500';
  state.editorEmoji = '📢';
  state.editorTags = [];
  state.editorTagInput = '';
  state.editorTemplate = null;
  state.view = 'template';
  render();
};

window.selectTemplate = function(id) {
  const t = TEMPLATES.find(x => x.id===id);
  state.editorTemplate = t;
  state.editorContent = t.content;
  if(id==='mantenimiento') { state.editorGrad='from-orange-400 to-amber-500'; state.editorEmoji='🔧'; }
  else if(id==='evento')  { state.editorGrad='from-emerald-400 to-green-500'; state.editorEmoji='🎉'; }
  else if(id==='reglamento') { state.editorGrad='from-violet-400 to-purple-500'; state.editorEmoji='📋'; }
  else if(id==='logro')   { state.editorGrad='from-blue-400 to-indigo-500'; state.editorEmoji='🏆'; }
  else if(id==='aviso')   { state.editorGrad='from-teal-400 to-cyan-500'; state.editorEmoji='📢'; }
  else                    { state.editorGrad='from-slate-500 to-slate-700'; state.editorEmoji='✏️'; }
  state.view = 'editor';
  render();
};

window.editArticle = function(id) {
  const a = state.articles.find(x=>x.id===id);
  if(!a) return;
  state.activeArticle = a;
  state.editorTitle   = a.title;
  state.editorExcerpt = a.excerpt;
  state.editorContent = a.content;
  state.editorGrad    = a.coverGrad;
  state.editorEmoji   = a.coverEmoji;
  state.editorTags    = [...(a.tags||[])];
  state.editorTemplate= null;
  state.view = 'editor';
  render();
};

window.viewArticle = function(id) {
  const a = state.articles.find(x=>x.id===id);
  if(!a) return;
  state.activeArticle = a;
  state.view = 'reader';
  render();
};

window.deleteArticle = function(id) {
  if(!confirm('¿Eliminar este artículo? Esta acción no se puede deshacer.')) return;
  state.articles = state.articles.filter(a=>a.id!==id);
  showToast('Artículo eliminado');
  render();
};

window.setSearch = function(v) {
  state.searchQuery = v;
  renderDashboard();
};

window.setFilter = function(s) {
  state.statusFilter = s;
  renderDashboard();
};

window.setCategoryFilter = function(c) {
  state.categoryFilter = c;
  renderDashboard();
};

window.clearAllFilters = function() {
  state.categoryFilter = 'all';
  state.statusFilter = 'all';
  state.searchQuery = '';
  renderDashboard();
};

window.setCover = function(g, e) {
  state.editorGrad = g;
  state.editorEmoji = e;
  renderEditor();
};

window.addTag = function() {
  const v = (document.getElementById('tag-input')?.value || state.editorTagInput).trim().toLowerCase();
  if(v && !state.editorTags.includes(v)) { state.editorTags.push(v); }
  state.editorTagInput = '';
  renderEditor();
};

window.removeTag = function(t) {
  state.editorTags = state.editorTags.filter(x=>x!==t);
  renderEditor();
};

window.fmt = function(cmd) {
  document.getElementById('editor-body')?.focus();
  if(cmd.startsWith('formatBlock')) {
    document.execCommand('formatBlock', false, cmd.replace('formatBlock',''));
  } else {
    document.execCommand(cmd, false, null);
  }
};

window.insertImg = function(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('editor-body')?.focus();
    document.execCommand('insertImage', false, ev.target.result);
  };
  reader.readAsDataURL(file);
};

window.insertTenantData = function() {
  const el = document.getElementById('editor-body');
  if(!el) return;
  el.focus();
  const html = `<p><strong>${TENANT.name}</strong><br>${TENANT.location}<br>📞 ${TENANT.phone}<br>📧 ${TENANT.email}</p>`;
  document.execCommand('insertHTML', false, html);
  showToast('Datos del condominio insertados');
};

window.saveDraft = function() {
  const title = document.getElementById('editor-title')?.value || state.editorTitle;
  const excerpt = document.getElementById('editor-excerpt')?.value || state.editorExcerpt;
  const content = document.getElementById('editor-body')?.innerHTML || state.editorContent;

  if(!title.trim()) { showToast('Escribe un título para el artículo','error'); return; }

  if(state.activeArticle) {
    const idx = state.articles.findIndex(a=>a.id===state.activeArticle.id);
    if(idx>-1) {
      state.articles[idx] = {...state.articles[idx], title, excerpt, content, status:'draft', coverGrad:state.editorGrad, coverEmoji:state.editorEmoji, tags:[...state.editorTags]};
    }
  } else {
    state.articles.unshift({ id: Date.now(), status:'draft', title, excerpt, content,
      coverGrad:state.editorGrad, coverEmoji:state.editorEmoji, author:'Administración',
      date: new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}),
      views:0, tags:[...state.editorTags] });
  }
  showToast('💾 Borrador guardado correctamente');
  state.view='dashboard';
  render();
};

window.openPublish = function() {
  const title = document.getElementById('editor-title')?.value || state.editorTitle;
  if(!title.trim()) { showToast('Escribe un título para el artículo','error'); return; }
  state.editorTitle = title;
  state.editorExcerpt = document.getElementById('editor-excerpt')?.value || state.editorExcerpt;
  state.editorContent = document.getElementById('editor-body')?.innerHTML || state.editorContent;
  state.view = 'publish';
  render();
};

window.setAudience = function(a) {
  state.publishAudience = a;
  renderPublish();
};

window.toggleRole = function(k) {
  if(state.publishRoles.includes(k)) state.publishRoles = state.publishRoles.filter(r=>r!==k);
  else state.publishRoles.push(k);
  renderPublish();
};

window.toggleUser = function(id) {
  if(state.publishUsers.includes(id)) state.publishUsers = state.publishUsers.filter(u=>u!==id);
  else state.publishUsers.push(id);
  renderPublish();
};

window.setUserSearch = function(v) {
  state.userSearch = v;
  renderPublish();
};

window.doPublish = function() {
  const audLabel = state.publishAudience==='all' ? 'todos los usuarios'
    : state.publishAudience==='roles' ? `${state.publishRoles.length} tipo(s) de usuario`
    : `${state.publishUsers.length} usuario(s)`;

  const existing = state.activeArticle ? state.articles.findIndex(a=>a.id===state.activeArticle.id) : -1;
  const newArt = {
    id: state.activeArticle?.id || Date.now(), status:'published',
    title: state.editorTitle, excerpt: state.editorExcerpt, content: state.editorContent,
    coverGrad: state.editorGrad, coverEmoji: state.editorEmoji,
    author:'Administración',
    date: new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}),
    views:0, tags:[...state.editorTags],
    audience: state.publishAudience,
  };
  if(existing>-1) state.articles[existing] = newArt;
  else state.articles.unshift(newArt);

  showToast(`🎉 ¡Artículo publicado! Visible para ${audLabel}`);
  state.view='dashboard';
  state.activeArticle = null;
  render();
};

window.toggleLike = function(btn) {
  const span = btn.querySelector('.like-count');
  const current = parseInt(span.textContent);
  const liked = btn.dataset.liked==='true';
  btn.dataset.liked = liked?'false':'true';
  span.textContent = liked ? current-1 : current+1;
  btn.classList.toggle('text-rose-500',!liked);
  btn.classList.toggle('text-slate-400',liked);
};

// ── Main render ───────────────────────────────────────────────────
function render() {
  switch(state.view) {
    case 'dashboard': renderDashboard(); break;
    case 'template':  renderTemplate();  break;
    case 'editor':    renderEditor();    break;
    case 'reader':    renderReader();    break;
    case 'publish':   renderPublish();   break;
  }
}

render();
</script>
</body>
</html>
